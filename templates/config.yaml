# docsync configuration — committed to the case repo, shared by every worktree.
# Secrets are NOT stored here. Set these environment variables (locally and as CI secrets):
#   CONFLUENCE_BASE_URL   e.g. https://yourcompany.atlassian.net/wiki
#   CONFLUENCE_EMAIL      the Atlassian account that owns the API token
#   CONFLUENCE_API_TOKEN  https://id.atlassian.com/manage-profile/security/api-tokens

case_name: "__CASE_NAME__"

confluence:
  space_key: "__SPACE_KEY__"          # safety check: root page must live in this space
  root_page_id: "__ROOT_PAGE_ID__"    # the ONLY page whose subtree docsync may touch
  title_prefix: "__TITLE_PREFIX__"    # Confluence titles must be unique per space; e.g. "[MMM] "

docs_dir: __DOCS_DIR__                # one markdown file = one Confluence page
base_branch: __BASE_BRANCH__          # trunk that PRs merge into

# Which files count as "pipeline code" for the PR gate and for /docsync:update.
watch_paths:
  - "**/*.sql"
  - "**/*.py"
  - "dbt/**"
  - "airflow/**"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.tf"
ignore_paths:
  - "tests/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - ".github/**"
  - "**/*.md"
  - "**/*.lock"
  - "**/requirements*.txt"

# When someone edits a page directly in Confluence, the repo version wins on the next push
# (docs-as-code is the single source of truth). Set false to skip such pages and warn instead.
overwrite_manual_edits: true

# ci:    GitHub Actions publishes on merge (repo secrets required).
# local: you run /docsync:merge — it merges the PR with gh and publishes from your machine with your credentials.
publish_mode: __PUBLISH_MODE__

# Maintain a generated "Change Log" page under the root from .docsync/audit.jsonl.
changelog_page: true
